[project]
name = "matinfix"
version = "0.1.0"
description = "MATINFIX repair service operations platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "aiosqlite>=0.20,<1",
  "redis>=5,<7",
  "aiogram>=3.20,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
