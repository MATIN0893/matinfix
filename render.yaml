services:
  - type: web
    name: matinfix-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: MATINFIX
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: matinfix-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ACCOUNTANT_CODEWORD
        sync: false

databases:
  - name: matinfix-db
    plan: free
    region: frankfurt
    databaseName: matinfix
    user: matinfix
