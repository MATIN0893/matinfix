services:
  - type: web
    name: matinfix-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: MATINFIX
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: matinfix-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: MASTER_TELEGRAM_USER_IDS
        sync: false
      - key: TELEGRAM_WORKSPACE_ID
        value: telegram-default
      - key: ACCOUNTANT_CODEWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://matinfix-dtceinuc.manus.space
      - key: PUBLIC_WEB_URL
        value: https://matinfix-dtceinuc.manus.space

databases:
  - name: matinfix-db
    plan: free
    region: frankfurt
    databaseName: matinfix
    user: matinfix
