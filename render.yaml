services:
  - type: web
    name: matinfix-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: MATINFIX
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: matinfix-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: matinfix-redis
          type: keyvalue
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ACCOUNTANT_CODEWORD
        sync: false

  - type: keyvalue
    name: matinfix-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru

databases:
  - name: matinfix-postgres
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: matinfix
    user: matinfix
